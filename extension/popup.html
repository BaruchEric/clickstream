<!doctype html><html lang="en"><meta charset="utf-8"><title>Chronicle Capture</title><link rel="stylesheet" href="popup.css"><body><h1>Chronicle</h1><p>Record locally. Keep what matters.</p><label>Pairing token<input id="token" type="password" autocomplete="off"></label><label><input id="recording" type="checkbox"> Record new visits (URLs, titles, times)</label><button type="button" id="settings">Save connection & recording</button><button type="button" id="sync">Sync queued events</button><hr><button type="button" id="preview">Preview page capture</button><div id="capture" hidden><p>Review or edit the text before saving. Form fields and editable areas are excluded. Only the loaded page text or your selection is captured.</p><textarea id="content" aria-label="Captured page text"></textarea><button type="button" id="save">Save capture locally</button><p>Agent digest sends this reviewed text to Codex’s model provider using your local Codex login.</p><button type="button" id="digest">Save + request agent digest</button></div><p id="status" role="status"></p><a href="http://127.0.0.1:4400/" target="_blank">Open Chronicle</a><script src="popup.js"></script></body></html>
